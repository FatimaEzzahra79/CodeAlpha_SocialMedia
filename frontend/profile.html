<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Social - Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============================ NAVBAR ============================ -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Code<span>Alpha</span> Social</a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Feed</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="login.html" id="navLogin">Login</a>
        <a href="register.html" id="navRegister" class="btn btn-outline btn-sm">Register</a>
        <div class="nav-user hidden" id="navUserWrap">
          <a href="profile.html" class="nav-user-link">
            <img id="navAvatar" class="nav-avatar" alt="Avatar" />
            <span id="navUserName">User</span>
          </a>
          <button class="btn btn-outline btn-sm" id="navLogout" type="button">Logout</button>
        </div>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </header>

  <!-- ============================ PROFILE =========================== -->
  <main class="container section">
    <div id="profileHeader" class="card profile-card">
      <p class="muted">Loading profile...</p>
    </div>

    <h2 class="section-title">Posts</h2>
    <div id="profilePosts" class="grid-posts">
      <p class="muted">Loading posts...</p>
    </div>
  </main>

  <!-- ======================= EDIT PROFILE MODAL ===================== -->
  <div class="modal hidden" id="editModal" role="dialog" aria-modal="true">
    <div class="modal-content card">
      <div class="modal-head">
        <h2>Edit Profile</h2>
        <button class="modal-close" id="editClose" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="editForm" novalidate>
        <div class="form-group">
          <label for="editName">Name</label>
          <input class="input" type="text" id="editName" maxlength="60" required />
        </div>
        <div class="form-group">
          <label for="editBio">Bio</label>
          <textarea class="textarea" id="editBio" rows="3" maxlength="160" placeholder="Tell people about yourself"></textarea>
        </div>
        <div class="form-group">
          <label for="editAvatar">Avatar URL</label>
          <input class="input" type="url" id="editAvatar" placeholder="https://..." />
        </div>
        <p class="form-error hidden" id="editError"></p>
        <button type="submit" class="btn btn-block" id="editSaveBtn">Save Changes</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Built for CodeAlpha Full Stack Development Internship</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
