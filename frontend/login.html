<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Social - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <!-- ============================ NAVBAR ============================ -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Code<span>Alpha</span> Social</a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Feed</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="navLogin" class="active">Login</a>
        <a href="register.html" id="navRegister" class="btn btn-outline btn-sm">Register</a>
        <div class="nav-user hidden" id="navUserWrap">
          <a href="profile.html" class="nav-user-link">
            <img id="navAvatar" class="nav-avatar" alt="Avatar" />
            <span id="navUserName">User</span>
          </a>
          <button class="btn btn-outline btn-sm" id="navLogout" type="button">Logout</button>
        </div>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </header>

  <!-- ============================= LOGIN ============================ -->
  <main class="container section auth-wrap">
    <div class="card auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to like, comment and share posts.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
        </div>

        <p class="form-error hidden" id="loginError"></p>

        <button type="submit" class="btn btn-block" id="loginBtn">Log In</button>
      </form>

      <p class="auth-alt">
        No account yet? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Built for CodeAlpha Full Stack Development Internship</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
